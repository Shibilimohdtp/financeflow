  </g>

  <!-- Right Typography -->
  <text x="165" y="88" class="wm-main" fill="#1B1D17">Finance<tspan fill="#485231" font-weight="500">Flow</tspan></text>
  <text x="168" y="120" class="wm-sub" fill="#575B50">Still Water for Your Financial Life</text>
